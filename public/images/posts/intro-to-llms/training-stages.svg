		.d2-912324653 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="cmF3"><g class="shape" ><path d="M 35 24 C 35 0 112 0 120 0 C 129 0 205 0 205 24 V 142 C 205 166 129 166 120 166 C 112 166 35 166 35 142 V 24 Z" stroke="#3b82f6" fill="#eff6ff" style="stroke-width:2;" /><path d="M 35 24 C 35 48 112 48 120 48 C 129 48 205 48 205 24" stroke="#3b82f6" fill="#eff6ff" style="stroke-width:2;" /></g><text x="120" y="76.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="120" dy="0">Raw text</tspan><tspan x="120" dy="17.25">trillions of tokens</tspan><tspan x="120" dy="17.25">web, code, books</tspan><tspan x="120" dy="17.25">no labels needed</tspan></text></g><g class="cHJldHJhaW4="><g class="shape" ><rect x="0" y="266" width="239" height="98" stroke="#3b82f6" fill="#dbeafe" style="stroke-width:2;" /></g><text x="119.5" y="304.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="119.5" dy="0">1. Pre-training</tspan><tspan x="119.5" dy="17.666667">predict the next token</tspan><tspan x="119.5" dy="17.666667">months, thousands of GPUs</tspan></text></g><g class="YmFzZQ=="><g class="shape" ><rect x="3" y="498" width="234" height="98" stroke="#f59e0b" fill="#fef3c7" style="stroke-width:2;" /></g><text x="120" y="536.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="120" dy="0">Base model</tspan><tspan x="120" dy="17.666667">knows language and facts</tspan><tspan x="120" dy="17.666667">behaves like autocomplete</tspan></text></g><g class="ZGVtb3M="><g class="shape" ><path d="M 297 488 C 297 464 390 464 401 464 C 411 464 504 464 504 488 V 606 C 504 630 411 630 401 630 C 390 630 297 630 297 606 V 488 Z" stroke="#9333ea" fill="#f5f3ff" style="stroke-width:2;" /><path d="M 297 488 C 297 512 390 512 401 512 C 411 512 504 512 504 488" stroke="#9333ea" fill="#f5f3ff" style="stroke-width:2;" /></g><text x="400.5" y="540.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="400.5" dy="0">Demonstrations</tspan><tspan x="400.5" dy="17.25">(prompt, ideal answer)</tspan><tspan x="400.5" dy="17.25">tens of thousands</tspan><tspan x="400.5" dy="17.25">written by humans</tspan></text></g><g class="c2Z0"><g class="shape" ><rect x="144" y="730" width="231" height="114" stroke="#9333ea" fill="#e9d5ff" style="stroke-width:2;" /></g><text x="259.5" y="768.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="259.5" dy="0">2. SFT</tspan><tspan x="259.5" dy="17.25">same next-token loss,</tspan><tspan x="259.5" dy="17.25">scored on the answer only</tspan><tspan x="259.5" dy="17.25">days, a few GPUs</tspan></text></g><g class="aW5zdHJ1Y3Q="><g class="shape" ><rect x="155" y="978" width="209" height="98" stroke="#f59e0b" fill="#fef3c7" style="stroke-width:2;" /></g><text x="259.5" y="1016.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="259.5" dy="0">Instruct model</tspan><tspan x="259.5" dy="17.666667">answers the question</tspan><tspan x="259.5" dy="17.666667">instead of continuing it</tspan></text></g><g class="cHJlZnM="><g class="shape" ><path d="M 424 968 C 424 944 538 944 551 944 C 564 944 678 944 678 968 V 1086 C 678 1110 564 1110 551 1110 C 538 1110 424 1110 424 1086 V 968 Z" stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /><path d="M 424 968 C 424 992 538 992 551 992 C 564 992 678 992 678 968" stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="551" y="1020.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="551" dy="0">Preferences</tspan><tspan x="551" dy="17.25">(prompt, answer A, answer B,</tspan><tspan x="551" dy="17.25">which one is better)</tspan><tspan x="551" dy="17.25">no ideal answer written</tspan></text></g><g class="YWxpZ24="><g class="shape" ><rect x="286" y="1210" width="239" height="98" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="405.5" y="1248.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="405.5" dy="0">3. Alignment</tspan><tspan x="405.5" dy="17.666667">RLHF or DPO</tspan><tspan x="405.5" dy="17.666667">learn the taste, not the text</tspan></text></g><g class="Y2hhdA=="><g class="shape" ><rect x="306" y="1408" width="199" height="114" stroke="#ea580c" fill="#fed7aa" style="stroke-width:3;" /></g><text x="405.5" y="1446.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="405.5" dy="0">Chat model</tspan><tspan x="405.5" dy="17.25">helpful, steady tone,</tspan><tspan x="405.5" dy="17.25">declines harmful asks</tspan><tspan x="405.5" dy="17.25">← this is what you call</tspan></text></g><g class="KHJhdyAtJmd0OyBwcmV0cmFpbilbMF0="><marker id="mk-d2-912324653-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 119.980001 167.9999 C 119.599998 206 119.5 226 119.5 262" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-912324653-3488378134)" mask="url(#d2-912324653)" /></g><g class="KHByZXRyYWluIC0mZ3Q7IGJhc2UpWzBd"><path d="M 119.5 366 C 119.5 404 119.5 430.799988 119.5 494" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-912324653-3488378134)"